services:
  - type: web
    name: floodguard-bd
    env: python
    buildCommand: pip install -r requirements.txt && (python train_real_model.py || echo "AUTHENTIC_MODEL_NOT_READY_AT_BUILD; dashboard will expose source data when available")
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    autoDeploy: true
